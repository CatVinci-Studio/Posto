name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          # macOS Intel
          - os: macos-13
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          # Windows: NSIS .exe + WiX .msi
          - os: windows-latest
            args: ''
            rust_targets: ''
          # Linux: .AppImage + .deb + .rpm.
          - os: ubuntu-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk + soup3 are required for the webview, librsvg for icons,
      # libayatana-appindicator for the tray (kept even if unused — Tauri's
      # default features pull it in). openssl/pkg-config for the IMAP /
      # SMTP TLS stacks.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OAuth client IDs are stamped into the binary at build time.
          # See README → "OAuth client IDs" for how to register them.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Automated release for ${{ github.ref_name }}.'
          # Semver prerelease tags (anything with a hyphen, e.g. v0.2.0-1)
          # publish as a GitHub prerelease; stable tags as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
